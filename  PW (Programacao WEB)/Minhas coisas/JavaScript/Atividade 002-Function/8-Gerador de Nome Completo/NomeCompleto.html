<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="NomeCompleto.css">

    <title>Nome completo</title>
</head>
<body>
 <main id="alinhamento">
     <h1>Nome e sobrenome</h1>
          <form id="formulario">
             <label for="nome">
                 <p>Veja o seu nome com sobrenome</p>
                 <input type="text" placeholder="Insira seu nome" id="nome">
                </label>
                <label for="sobrenome">
                 <input type="text" placeholder="Insira seu sobrenome" id="sobrenome">
                 <button type="button">Verificar</button>
               </label>
                 <h2 id="resultado"></h2>     
          </form>
        </main>
     <script src="NomeCompleto.js"></script>
</body>
</html>
